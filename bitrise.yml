
format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  build:
    title: Build Swift Package
    description: Resolve dependencies and build the Swift package
    steps:
      - git-clone@8: {}

      - script@1:
          title: Resolve and Build Swift Package
          inputs:
            - content: |
                #!/bin/bash
                set -e

                echo "Resolving latest dependencies..."
                swift package update

                echo "Building Swift package..."
                swift build -v

                echo "Build completed successfully!"

